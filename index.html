<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crestview Big Red Machine Quartermaster</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Oswald', sans-serif;
    background:black;
    color:white;
    min-height:100vh;
}

header{
    background:linear-gradient(90deg,#7f1d1d,#b91c1c,#7f1d1d);
    border-bottom:4px solid gold;
    padding:25px;
    text-align:center;
}

header h1{
    font-size:3rem;
}

header p{
    color:gold;
    margin-top:5px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.box{
    background:#111827;
    border:1px solid #374151;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
}

.section-title{
    color:gold;
    margin-bottom:15px;
}

input,
button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-size:1rem;
}

input{
    background:white;
}

button{
    background:gold;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.uniform-card{
    background:#7f1d1d;
    border-left:5px solid gold;
    border-radius:12px;
    padding:20px;
    margin-top:15px;
}

.mini-box{
    background:rgba(0,0,0,0.2);
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.delete-btn{
    background:#dc2626;
    color:white;
    margin-top:15px;
}

#mainContent{
    display:none;
}

#errorMessage{
    color:#f87171;
    margin-top:10px;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    header h1{
        font-size:2rem;
    }

}

</style>
</head>

<body>

<header>

    <h1>
        Crestview Big Red Machine
    </h1>

    <p>
        Digital Quartermaster System
    </p>

</header>

<div class="container">

    <div class="box" id="loginBox">

        <h2 class="section-title">
            Access System
        </h2>

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
        >

        <button onclick="login()">
            Enter
        </button>

        <p id="errorMessage"></p>

    </div>

    <div id="mainContent">

        <div class="box">

            <h2 class="section-title">
                Add Uniform
            </h2>

            <input
                type="text"
                id="uniformName"
                placeholder="Student Name"
            >

            <input
                type="text"
                id="uniformNumber"
                placeholder="Uniform Number"
            >

            <div class="grid">

                <div class="mini-box">

                    <strong>Jacket Number</strong>

                    <input
                        type="text"
                        id="jacketNumber"
                    >

                </div>

                <div class="mini-box">

                    <strong>Bibber Number</strong>

                    <input
                        type="text"
                        id="bibberNumber"
                    >

                </div>

            </div>

            <button onclick="addUniform()">
                Add Uniform
            </button>

        </div>

        <div class="box">

            <h2 class="section-title">
                Search Uniforms
            </h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search uniforms..."
                onkeyup="searchUniforms()"
            >

            <div id="uniformContainer"></div>

        </div>

    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey: "AIzaSyDXPx1utN8wgGoitpzFwQJXwI5Ik701nU0",

    authDomain: "crestview-quartermaster.firebaseapp.com",

    projectId: "crestview-quartermaster",

    storageBucket: "crestview-quartermaster.firebasestorage.app",

    messagingSenderId: "24753654676",

    appId: "1:24753654676:web:e2e5972798660d12505d81"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const uniformsCollection =
    collection(db, "uniforms");

/* WEBSITE PASSWORD */

const websitePassword = "bigredmachine";

/* LOGIN */

window.login = function(){

    const enteredPassword =
        document.getElementById("password").value;

    if(enteredPassword === websitePassword){

        document.getElementById("loginBox")
            .style.display = "none";

        document.getElementById("mainContent")
            .style.display = "block";

        localStorage.setItem(
            "quartermasterAccess",
            "granted"
        );

    } else {

        document.getElementById("errorMessage")
            .innerText = "Incorrect Password";

    }

}

/* AUTO LOGIN */

if(localStorage.getItem("quartermasterAccess") === "granted"){

    document.getElementById("loginBox")
        .style.display = "none";

    document.getElementById("mainContent")
        .style.display = "block";

}

/* ADD UNIFORM */

window.addUniform = async function(){

    const name =
        document.getElementById("uniformName").value;

    const uniformNumber =
        document.getElementById("uniformNumber").value;

    const jacketNumber =
        document.getElementById("jacketNumber").value;

    const bibberNumber =
        document.getElementById("bibberNumber").value;

    if(name === "" || uniformNumber === ""){

        alert("Fill in required fields.");

        return;

    }

    await addDoc(uniformsCollection, {

        name,
        uniformNumber,
        jacketNumber,
        bibberNumber

    });

}

/* LIVE DATABASE */

let allUniforms = [];

onSnapshot(uniformsCollection, snapshot => {

    allUniforms = [];

    snapshot.forEach(docItem => {

        allUniforms.push({

            id: docItem.id,

            ...docItem.data()

        });

    });

    renderUniforms(allUniforms);

});

/* RENDER */

function renderUniforms(data){

    const container =
        document.getElementById("uniformContainer");

    container.innerHTML = "";

    data.forEach(uniform => {

        container.innerHTML += `

        <div class="uniform-card">

            <h3>${uniform.name}</h3>

            <p>
                <strong>Uniform Number:</strong>
                ${uniform.uniformNumber}
            </p>

            <div class="grid">

                <div class="mini-box">

                    <strong>Jacket Number</strong>

                    <p>${uniform.jacketNumber}</p>

                </div>

                <div class="mini-box">

                    <strong>Bibber Number</strong>

                    <p>${uniform.bibberNumber}</p>

                </div>

            </div>

            <button
                class="delete-btn"
                onclick="deleteUniform('${uniform.id}')"
            >
                Delete Uniform
            </button>

        </div>

        `;

    });

}

/* SEARCH */

window.searchUniforms = function(){

    const value =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    const filtered = allUniforms.filter(uniform =>

        uniform.name.toLowerCase().includes(value)

        ||

        uniform.uniformNumber.toLowerCase().includes(value)

        ||

        uniform.jacketNumber.toLowerCase().includes(value)

        ||

        uniform.bibberNumber.toLowerCase().includes(value)

    );

    renderUniforms(filtered);

}

/* DELETE */

window.deleteUniform = async function(id){

    await deleteDoc(doc(db, "uniforms", id));

}

</script>

</body>
</html>
